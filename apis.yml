aid: worksmith
name: Worksmith
description: Worksmith is a retail operations platform founded in 2015 that unites
  workplace and workforce management for multi-location retailers. Worksmith Workplace
  covers facilities management, vendor sourcing, maintenance, and work-order tracking
  through a curated nationwide network of vetted service providers, while Worksmith
  Workforce (Progress Retail) covers scheduling, task management, training, and store
  audits. The company is SOC 2 Type II compliant, publishes a public status page that
  lists a Worksmith API component, and runs a private GraphQL API at api.worksmith.com
  with no public developer program. Backed by Battery Ventures.
